{% extends 'base.html' %}
{% block content %}
<h1>Edit {{ t.ticker|upper }} Playbook entry</h1>
<div class="card">
    <form method="post" enctype="multipart/form-data" id="playbook-edit-form">
        <div class="grid">
            <label>Ticker
                <input type="text" name="ticker" maxlength="8" required value="{{ t.ticker }}" style="text-transform:uppercase;">
            </label>
            <label>Market
                <select name="market">
                    {% for m in ['Stocks','Crypto','Forex','Options','Futures'] %}
                    <option value="{{ m }}" {% if t.market == m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Direction
                <select name="direction">
                    {% for d in ['long','short'] %}
                    <option value="{{ d }}" {% if t.direction == d %}selected{% endif %}>{{ d|capitalize }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Entry Date
                <input type="date" name="entry_date" required value="{{ t.entry_date }}">
            </label>
            <label>Entry Price
                <input type="number" name="entry_price" required value="{{ t.entry_price }}">
            </label>
            <label>Stop Loss
                <input type="text" name="stop_loss" placeholder="$ or %" value="{{ t.stop_loss if t.stop_loss is not none else '' }}">
            </label>
            <label>Entry Method
                <select name="entry_method">
                    {% for opt in entry_methods %}
                    <option value="{{ opt }}" {% if t.setup == opt %}selected{% endif %}>{{ opt }}</option>
                    {% endfor %}
                </select>
            </label>
            <label>Entry Strategy
                <input type="text" name="entry_strategy" required value="{{ t.thesis }}">
            </label>
            <label>Exit Strategy
                <input type="text" name="exit_strategy" required value="{{ t.lessons }}">
            </label>
        </div>
        <label style="display:block;margin-top:1em;">
            <input type="file" name="screenshots" accept="image/*" multiple id="screenshotsInput" style="display:none;">
            <div id="dropZone" class="dropzone-modern">
                Drag &amp; drop, paste, or click here to add screenshots (multiple allowed)
            </div>
            <div id="previewRow" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;"></div>
        </label>

        {% if shots and shots|length > 0 %}
        <div style="margin-top:1em;">
            <p class="muted" style="margin-bottom:.3em;">Current Screenshots:</p>
            <div class="shot-row" style="display:flex;gap:10px;flex-wrap:wrap;">
                {% for shot in shots %}
                <div style="position:relative;display:inline-block;">
                    <img src="{{ url_for('uploads', filename=shot.filename) }}"
                         alt="screenshot"
                         style="max-width:160px;border-radius:8px;object-fit:cover;box-shadow:0 2px 14px rgba(20,20,40,0.15);cursor:zoom-in;">
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <div style="margin-top:1.6em;display:flex;gap:1em;">
            <button type="submit" class="btn primary">Save Changes</button>
            <a href="{{ url_for('playbook') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

<!-- Modal for fullscreen viewing -->
<div id="imgModal"
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.93); z-index:1000; align-items:center; justify-content:center;">
    <img id="imgModalImg"
         src=""
         style="max-width:92vw; max-height:92vh; border-radius:14px; box-shadow:0 8px 60px #000b; display:block; margin:auto;">
    <button id="imgModalClose"
            style="position:absolute; top:2.5%; right:2.5%; font-size:2.6em; background:none; color:#fff; border:none; cursor:pointer; z-index:1001;">
        &times;
    </button>
</div>

<!-- You can copy over the same JS as in main playbook.html for drag/drop/paste, preview, and modal! -->

{% endblock %}
